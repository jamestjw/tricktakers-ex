<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tricktakers — Table</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    body { background: var(--paper-2); }
    .table-shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: calc(100vh - 60px);
    }
    .play-area {
      display: grid;
      grid-template-columns: 280px 1fr 280px;
      grid-template-rows: auto 1fr auto;
      gap: 24px;
      padding: 32px 48px;
      align-items: center;
    }
    .opp-row { grid-column: 1 / -1; display: flex; justify-content: space-around; }
    .opp {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .opp .seat { padding: 8px 14px; }
    .opp .opp-hand {
      display: flex;
    }
    .opp .opp-hand .pcard {
      margin-left: -22px;
      box-shadow: var(--sh-card), -2px 0 0 rgba(255,255,255,0.6);
      transition: transform 200ms ease;
    }
    .opp .opp-hand .pcard:first-child { margin-left: 0; }
    .opp .opp-hand .pcard:nth-child(1) { transform: rotate(-6deg) translateY(2px); }
    .opp .opp-hand .pcard:nth-child(2) { transform: rotate(0deg)  translateY(-2px); z-index: 2; }
    .opp .opp-hand .pcard:nth-child(3) { transform: rotate(6deg)  translateY(2px); }

    .center-stage {
      grid-column: 2;
      display: flex; flex-direction: column; align-items: center; gap: 24px;
    }
    .trick {
      width: 360px; height: 220px;
      position: relative;
      display: grid; place-items: center;
    }
    .trick .pcard {
      position: absolute;
      transition: transform 220ms cubic-bezier(.2,.8,.2,1);
    }
    .trick-meta {
      display: flex; gap: 24px; align-items: center;
      padding: 10px 18px;
      background: var(--paper);
      border: 1px solid var(--hair);
      border-radius: 999px;
    }
    .trick-meta .lead-color {
      display: inline-block; width: 14px; height: 14px; border-radius: 50%;
      background: var(--suit-red);
    }
    .your-side {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      gap: 24px;
      align-items: center;
      padding-top: 16px;
    }
    .your-actions {
      display: flex; flex-direction: column; gap: 10px;
      align-items: flex-end;
    }
    .your-info {
      display: flex; gap: 16px; align-items: center;
    }
    .timer {
      width: 48px; height: 48px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      display: grid; place-items: center;
      font-family: var(--font-mono); font-weight: 600;
      background: var(--paper);
    }
  </style>
</head>
<body>
  <div class="app" data-screen-label="04 Table">
    <div id="bar"></div>
    <div class="table-shell">
      <!-- Top status -->
      <div style="padding: 16px 48px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--hair); background: var(--paper);">
        <div class="eyebrow">Round 2 · Trick 3 of 5</div>
        <span class="dots">
          <span class="dot done"></span>
          <span class="dot done"></span>
          <span class="dot now"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </span>
        <div style="width: 1px; height: 18px; background: var(--hair-strong);"></div>
        <div class="row gap-2">
          <span class="crown">♛</span><span class="crown empty">♛</span><span class="crown empty">♛</span>
          <span class="muted body-sm" style="margin-left: 4px;">/</span>
          <span class="crown black">♛</span><span class="crown empty black" style="border-color: var(--hair-strong);">♛</span>
        </div>
        <div class="right" style="margin-left: auto; display: flex; gap: 12px; align-items: center;">
          <span class="pill">Lead color · Red</span>
          <span class="pill solid">akari leads</span>
          <button class="btn ghost sm">Rules</button>
          <button class="btn ghost sm">Leave</button>
        </div>
      </div>

      <!-- Play area -->
      <div class="play-area">
        <!-- Opponents -->
        <div class="opp-row">
          <div class="opp">
            <div class="seat">
              <span class="avatar a1">A</span>
              <div class="meta"><div class="name">akari</div><div class="role">Hermit · 4A</div></div>
              <div class="stat"><div class="label">Pts</div>90</div>
            </div>
            <div class="opp-hand" id="opp-akari"></div>
          </div>
          <div class="opp">
            <div class="seat active">
              <span class="avatar a2">R</span>
              <div class="meta"><div class="name">ryan_c</div><div class="role">Berserker · 5A</div></div>
              <div class="stat"><div class="label">Pts</div>60</div>
            </div>
            <div class="opp-hand" id="opp-ryan"></div>
          </div>
          <div class="opp">
            <div class="seat">
              <span class="avatar a3">F</span>
              <div class="meta"><div class="name">fumi</div><div class="role">Gambler · 2A</div></div>
              <div class="stat"><div class="label">Pts</div>30</div>
            </div>
            <div class="opp-hand" id="opp-fumi"></div>
          </div>
        </div>

        <!-- Center -->
        <div class="center-stage">
          <div class="trick-meta">
            <span class="row gap-2"><span class="lead-color"></span> Red led</span>
            <span class="muted">·</span>
            <span class="muted">Must follow</span>
          </div>
          <div class="trick" id="trick"></div>
          <div class="row gap-3">
            <button class="btn gold sm" disabled style="opacity:.6;">Declare Kakumei</button>
            <span class="muted body-sm">Ryan_c is thinking…</span>
          </div>
        </div>

        <!-- Your side -->
        <div class="your-side">
          <div class="your-info">
            <div class="seat you">
              <span class="avatar a4">H</span>
              <div class="meta"><div class="name">Hiroken (you)</div><div class="role">King · 1A</div></div>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
            <div class="hand" id="your-hand" style="height: 180px; width: 540px;"></div>
            <div class="row gap-3">
              <button class="btn ghost sm" id="btn-cancel">Cancel</button>
              <button class="btn" id="btn-play">Play card</button>
              <a class="btn ghost sm" href="resolve.html">Skip → Trick</a>
            </div>
          </div>
          <div class="your-actions">
            <div class="row gap-3">
              <div class="timer">18</div>
              <div style="text-align: right;">
                <div class="eyebrow">Your turn</div>
                <div class="body-sm muted">Pick any Red, or override.</div>
              </div>
            </div>
            <div class="row gap-2">
              <span class="pill">Tricks won · 1</span>
              <span class="pill">Pts · 120</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/tt.js"></script>
  <script>
    document.getElementById("bar").outerHTML = TT.appBar("table");

    // Opponent hands (face down, fanned)
    function renderOpp(id, n) {
      const el = document.getElementById(id);
      for (let i = 0; i < n; i++) {
        el.insertAdjacentHTML("beforeend", TT.pcard({ kind: "back", size: "sm" }));
      }
    }
    renderOpp("opp-akari", 3);
    renderOpp("opp-ryan", 3);
    renderOpp("opp-fumi", 3);

    // Trick area — akari led Red 5, fumi played Red 2 (later in turn order is to your left? we'll show 2 played + waiting for ryan + you)
    const trick = document.getElementById("trick");
    const played = [
      { ...{ suit: "red", value: 5, kind: "number" }, x: -130, y: -10, rot: -6, who: "akari (lead)" },
      { ...{ suit: "red", value: 2, kind: "number" }, x: 0,    y: -30, rot: 4,  who: "fumi" },
    ];
    played.forEach(p => {
      const wrap = document.createElement("div");
      wrap.innerHTML = TT.pcard(p);
      const el = wrap.firstElementChild;
      el.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${p.rot}deg)`;
      trick.appendChild(el);
    });
    // Empty slot for ryan + you
    trick.insertAdjacentHTML("beforeend", `
      <div style="position: absolute; transform: translate(140px, -20px) rotate(8deg); width: 96px; height: 140px; border: 2px dashed var(--hair-strong); border-radius: 10px; display: grid; place-items: center; color: var(--ink-faint); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;">RYAN</div>
    `);

    // Your hand
    const yours = [
      { suit: "red", value: 9, kind: "number" },
      { suit: "red", value: 4, kind: "number" },
      { suit: "blue", value: 2, kind: "number", disabled: true },
      { suit: "black", value: 1, kind: "number", disabled: true },
      { kind: "rare" },
    ];
    TT.renderHand(document.getElementById("your-hand"), yours);

    document.getElementById("btn-play").addEventListener("click", () => {
      window.location.href = "resolve.html";
    });
  </script>
</body>
</html>
